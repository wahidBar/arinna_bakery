        <filter id="color-adjust" color-interpolation-filters="sRGB">
            <feComponentTransfer in="SourceGraphic" result="dimmingOutput">
                <feFuncR
                    type="linear"
                    slope="1"
                    intercept="0"
                    id="dynamicDimR"
                ></feFuncR>
                <feFuncG
                    type="linear"
                    slope="1"
                    intercept="0"
                    id="dynamicDimG"
                ></feFuncG>
                <feFuncB
                    type="linear"
                    slope="1"
                    intercept="0"
                    id="dynamicDimB"
                ></feFuncB>
            </feComponentTransfer>
            <feComponentTransfer in="dimmingOutput" result="gammaOutput">
                <feFuncR
                    type="gamma"
                    amplitude="1"
                    exponent="0.8000"
                    offset="0"
                    id="gammaR"
                ></feFuncR>
                <feFuncG
                    type="gamma"
                    amplitude="1"
                    exponent="0.8000"
                    offset="0"
                    id="gammaG"
                ></feFuncG>
                <feFuncB
                    type="gamma"
                    amplitude="1"
                    exponent="0.8000"
                    offset="0"
                    id="gammaB"
                ></feFuncB>
            </feComponentTransfer>
            <feComponentTransfer in="gammaOutput" result="finalOutput">
                <feFuncR
                    type="linear"
                    slope="1.0375"
                    intercept="-0.0500"
                    id="hsAdjustR"
                ></feFuncR>
                <feFuncG
                    type="linear"
                    slope="1.0375"
                    intercept="-0.0500"
                    id="hsAdjustG"
                ></feFuncG>
                <feFuncB
                    type="linear"
                    slope="1.0375"
                    intercept="-0.0500"
                    id="hsAdjustB"
                ></feFuncB>
            </feComponentTransfer>
        </filter></svg
    ><style id="video-filter-adjuster-styles">
        /* Videos*/

        html[vq_sidebar='visible']:not([vq_filters='default'])
            :is(video, iframe.vq-video-detected:not(#vqe-home-player)) {
            filter: blur(0.6px) saturate(85%) !important;
        }

        video,
        iframe.vq-video-detected:not(#vqe-home-player) {
            filter: none !important;
            transition: 15s filter ease !important;
        }

        html[vq-enabled][vq-enabled='true']:not([vq_filters='default'])
            :is(video, iframe.vq-video-detected:not(#vqe-home-player)),
        html[vq-enabled][vq-enabled='true']:not([vq_filters='default'])
            :is(:-webkit-full-screen, :fullscreen)
            :is(video, iframe.vq-video-detected:not(#vqe-home-player)) {
            filter: blur(0.4px) url(#sharpen) url(#color-adjust) !important;
            transition: 0s !important;
        }

        /* Images */
        html[vq-enabled][vq-enabled='true'][vq_images='improved']:not(
                [vq_filters='default']
            )
            img:not(.vq-subscribe-logo, #vq-review-logo) {
            filter: blur(0.4px) url(#sharpen) url(#color-adjust) !important;
            transition: 0s !important;
        }
    </style>
</html>
